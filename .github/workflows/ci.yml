# ============================================================================
# 本仓库 CI workflow（wasm 目标）
#
# 本文件是本仓库唯一的 CI 定义，由 push / pull_request / workflow_dispatch 触发。
# 模块是独立 git 仓库，workflow 必须放在模块内 .github/workflows/ 才会被 GitHub Actions 触发。
# 本仓库是独立发布单元，不存在仓库外的 CI 定义或汇总模板。
#
# 五道门禁（顺序执行，任一步非 0 即整 job 失败）：
#   1. moon check --deny-warn
#   2. moon build
#   3. moon test
#   4. moon fmt --check
#   5. moon info && git diff --exit-code -- pkg.generated.mbti cmd/main/pkg.generated.mbti
#      （pkg.generated.mbti 快照与源码一致性 fail-closed；cmd/main 下的快照同样纳入 diff 范围。
#        纳入范围 = 本仓库内受版本控制且由 moon info 生成的全部快照，即仓库根与 cmd/main 两处；
#        pkg.generated.mbti.r1 是 R1 基线存档、不由 moon info 生成，.mooncakes/ 下第三方包的
#        快照不受本仓库版本控制，二者均不在 diff 范围。）
# （可选 moon clean：仅清理，continue-on-error，不参与判定）
#
# 工具链版本策略（2026-11-18 修订）：
#   官方分发只提供 latest。指定版本的产物路径
#   https://cli.moonbitlang.com/binaries/<version>/moonbit-linux-x86_64.tar.gz
#   对 0.1.20261103 / 20261104 / 20261116 / 20261117 实测均返回 HTTP 403，
#   cli.moonbitlang.cn 镜像同样 403，仅 latest 可下载（200/206）。
#   因此「安装指定版本 + 硬断言精确版本」在官方渠道上不可实现：安装必然回退到
#   latest，断言必然随 latest 前进而失败。现改为：安装 latest，把实际版本写入构建
#   日志与 step summary，并校验 core 版本与 moonc 构建号一致（安装完整性）；
#   真正的正确性由下面五道门禁判定。
#
# 本仓库依赖策略（2026-11-09 修订，修正原「check/build 自动同步」的错误假设）：
#   - moon.mod 钉死精确版本（bobzhang/zip@0.1.2），版本不会漂移；漂移风险来自
#     「无版本声明 + 更新到 latest」，本仓库不存在该形态（ADR-0010 的关切不受影响）。
#   - 全新 checkout（GitHub runner）没有 ~/.moon/registry 索引，`moon check` 不会
#     自动引导索引，会报 "module was not found in the registry"（2026-11-09 云上与
#     本地冷启动均实测复现）；因此 CI 在门禁前执行一次 `moon update` 引导索引与
#     symbols——它只同步 registry 元数据，不改写 moon.mod 声明，依赖版本仍按
#     moon.mod 钉死值解析。
#   - `moon fetch <author>/<name>@<version> --no-update` 在无索引的冷环境实测失败
#     （os error 3，2026-11-09），不能用作冷启动引导，仅适用于已有索引的环境。
#   - 不用 `moon build --frozen`：全新 checkout 没有本地依赖缓存，--frozen 会直接失败。
#   - 版本安装：官方 CDN 不提供可下载的版本化产物（2026-11-18 对多个版本实测 403），
#     只安装 latest；版本号仅作记录，不作硬性等值断言（等值断言在 latest 前进时必然误报）。
# ============================================================================
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  five-gates:
    name: five-gates (apk)
    runs-on: ubuntu-latest
    # 本模块 preferred_target = "wasm"：五道门禁全部在 wasm 后端执行。
    # 本机同序实跑已通过（[已复验-本地等价]），不等同于 GitHub Actions 云上实跑。
    steps:
      - name: Checkout apk
        uses: actions/checkout@v5

      - name: Install MoonBit toolchain (latest)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.moon/tmp"
          if ! curl -fsSL https://cli.moonbitlang.com/install/unix.sh -o "$HOME/.moon/tmp/install.sh"; then
            echo "::error::cannot download https://cli.moonbitlang.com/install/unix.sh"
            exit 1
          fi
          bash "$HOME/.moon/tmp/install.sh"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Report toolchain versions and verify install integrity
        shell: bash
        run: |
          set -euo pipefail
          # 官方渠道只分发 latest（版本化产物路径实测 403，见文件头版本策略），
          # 故不对构建号做等值断言；此处校验安装完整性：core 版本必须等于 moonc 构建号。
          out="$(moon version --all)"
          echo "$out"
          {
            echo "### MoonBit toolchain"
            echo '```'
            echo "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          core_mod="$HOME/.moon/lib/core/moon.mod"
          [[ -f "$core_mod" ]] || { echo "::error::missing $core_mod (core not installed)"; exit 1; }
          core_ver="$(sed -n 's/^version *= *"\(.*\)"/\1/p' "$core_mod")"
          moonc_ver="$(sed -n 's/^moonc *v\?\([^ ]*\).*/\1/p' <<<"$out")"
          echo "core  $core_ver"
          echo "moonc $moonc_ver"
          if [[ -z "$core_ver" || -z "$moonc_ver" ]]; then
            echo "::error::cannot parse core/moonc versions (core='$core_ver', moonc='$moonc_ver')"
            exit 1
          fi
          if [[ "$core_ver" != "$moonc_ver" ]]; then
            echo "::error::broken toolchain install: core ($core_ver) != moonc build ($moonc_ver). Re-run the install step."
            exit 1
          fi

      # ---- 冷启动引导 + 五道门禁：顺序执行，任一非 0 即失败 ----
      - name: "Bootstrap moon registry index (cold checkout)"
        shell: bash
        run: |
          set -euo pipefail
          # 全新 runner 无 ~/.moon/registry 索引；`moon check` 不会自动引导，
          # 会报 "module was not found in the registry"。一次 `moon update`
          # 克隆 git 索引与 symbols；依赖版本仍由 moon.mod 钉死值解析（见文件头依赖策略）。
          moon update

      - name: "Gate 1/5 · moon check --deny-warn"
        shell: bash
        run: moon check --deny-warn

      - name: "Gate 2/5 · moon build"
        shell: bash
        run: moon build

      - name: "Gate 3/5 · moon test"
        shell: bash
        run: moon test

      - name: "Gate 4/5 · moon fmt --check"
        shell: bash
        run: moon fmt --check

      - name: "Gate 5/5 · moon info && git diff --exit-code -- pkg.generated.mbti"
        shell: bash
        run: |
          set -euo pipefail
          moon info
          if ! git diff --exit-code -- pkg.generated.mbti cmd/main/pkg.generated.mbti; then
            echo "::error::Gate 5/5 failed: pkg.generated.mbti snapshot out of sync with sources. Run 'moon info' locally and commit the regenerated snapshot together with the API change (additive changes also require a regenerated snapshot and an API-change note in this repository's README.md §2 and docs/CHANGELOG.md)."
            exit 1
          fi
          echo "Gate 5/5 OK: snapshot in sync (pkg.generated.mbti + cmd/main/pkg.generated.mbti)"

      - name: "Optional · moon clean (not a gate)"
        shell: bash
        continue-on-error: true
        run: moon clean
