# Reference: https://docs.github.com/en/copilot/how-tos/use-copilot-agents/coding-agent/customize-the-agent-environment
#
# 工具链版本说明：
#   1) 官方 CDN 只分发 latest：指定版本的产物路径对多个版本实测均返回 HTTP 403
#      （2026-11-18，cli.moonbitlang.com 与 .cn 镜像一致），故不再安装指定版本，
#      也不再对精确版本号做硬断言（latest 前进时等值断言必然误报）；
#   2) 依赖获取需一次 `moon update` 冷启动引导 registry 索引（2026-11-09 实测全新
#      runner 上 `moon check` 不会自动同步依赖，会报 "module was not found in the
#      registry"）；`moon update` 只同步 registry 元数据、不改写 moon.mod 钉死的
#      版本声明（例 bobzhang/zip@0.1.2），故仍满足版本可复现要求；
#   3) 真正的五道门禁（check --deny-warn → build → test → fmt --check → moon info 快照 diff）
#      在同目录 ci.yml。
name: "Copilot Setup Steps"

# Automatically run the setup steps when they are changed to allow for easy validation, and
# allow manual testing through the repository's "Actions" tab
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
  copilot-setup-steps:
    runs-on: ubuntu-latest

    # Set the permissions to the lowest permissions possible needed for your steps.
    # Copilot will be given its own token for its operations.
    permissions:
      contents: read

    # You can define any steps you want, and they will run before the agent starts.
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit (latest)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.moon/tmp"
          if ! curl -fsSL https://cli.moonbitlang.com/install/unix.sh -o "$HOME/.moon/tmp/install.sh"; then
            echo "::error::cannot download https://cli.moonbitlang.com/install/unix.sh"
            exit 1
          fi
          bash "$HOME/.moon/tmp/install.sh"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Report toolchain versions and verify install integrity
        shell: bash
        run: |
          set -euo pipefail
          out="$(moon version --all)"
          echo "$out"
          core_mod="$HOME/.moon/lib/core/moon.mod"
          [[ -f "$core_mod" ]] || { echo "::error::missing $core_mod (core not installed)"; exit 1; }
          core_ver="$(sed -n 's/^version *= *"\(.*\)"/\1/p' "$core_mod")"
          moonc_ver="$(sed -n 's/^moonc *v\?\([^ ]*\).*/\1/p' <<<"$out")"
          if [[ -z "$core_ver" || -z "$moonc_ver" ]]; then
            echo "::error::cannot parse core/moonc versions (core='$core_ver', moonc='$moonc_ver')"
            exit 1
          fi
          if [[ "$core_ver" != "$moonc_ver" ]]; then
            echo "::error::broken toolchain install: core ($core_ver) != moonc build ($moonc_ver)."
            exit 1
          fi

      # 依赖获取：全新 runner 无 ~/.moon/registry 索引，`moon check` 不会自动引导
      # （会报 "module was not found in the registry"，2026-11-09 冷启动实测）。
      # 因此需一次 `moon update` 引导索引与 symbols；依赖版本仍由 moon.mod 钉死的
      # 版本声明（例 bobzhang/zip@0.1.2）解析，`moon update` 只同步 registry 元数据、
      # 不改写 moon.mod 声明。真正的门禁在同目录 ci.yml。
      - name: Bootstrap moon registry index (cold checkout)
        shell: bash
        run: |
          set -euo pipefail
          moon update
